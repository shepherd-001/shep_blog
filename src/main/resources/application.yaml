server:
  port: ${PORT}

logging:
  level:
    org.springframework.web: INFO

#springdoc:
#  api-docs:
#    enabled: ${ENABLE_SPRING_DOC}
#  swagger-ui:
#    enabled: ${ENABLE_SWAGGER_UI}

spring:
  application:
    name: ShepBlog

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT}
      max-lifetime: ${HIKARI_MAX_LIFETIME}
      minimum-idle: ${HIKARI_MINIMUM_IDLE}

  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: true

  cache:
    type: redis
    redis:
      use-key-prefix: true
      key-prefix: ${spring.application.name}:${spring.profiles.active}
      enable-statistics: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 2000ms
      timeout: 3000ms
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: -1ms

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          from: ${MAIL_FROM_EMAIL}
          connectiontimeout: 20000
          timeout: 20000
          writetimeout: 20000

executor:
  mail:
    corePoolSize: ${CORE_POOL_SIZE}
    maxPoolSize: ${MAX_POOL_SIZE}
    queueCapacity: ${QUEUE_CAPACITY}

superadmin_email: ${ADMIN_EMAIL}
superadmin_password: ${ADMIN_PASSWORD}

client:
  url: ${CLIENT_URL}

mail_from_email: ${MAIL_FROM_EMAIL}
mail_from_name: ${MAIL_FROM_NAME}

reset_password_expiration: ${RESET_PASSWORD_EXPIRATION}
email_confirmation_expiration: ${EMAIL_CONFIRMATION_EXPIRATION}
admin_invite_expiration: ${ADMIN_INVITE_EXPIRATION}
author_onboarding_expiration: ${AUTHOR_ONBOARDING_EXPIRATION}

jwt:
  secret: ${JWT_SECRET_KEY}
  access_expiration: ${JWT_EXPIRATION}
  refresh_expiration: ${JWT_REFRESH_EXPIRATION}
  issuer: "ShepBlog"

app:
  security:
    allowed-origins:
      - http://localhost:3000
      - https://shep-blog.app
